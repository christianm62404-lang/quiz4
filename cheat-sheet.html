<script>
/* ===================== CONTENT ===================== */
const PAGES = [

/* ---------- PAGE 1 : REFERENCE A ---------- */
{ tag:"Reference · page 1 of 4", title:"Reference — DML / DDL / Queries", sc:"schema: Departments(dept_id,dept_name,dept_head→emp,budget,city) · Employees(emp_id,fname,lname,salary,dept_id,manager_id)", cards:[
  {hue:"--t0", k:"add / change / remove", h:"DML syntax & rules", body:
   `<pre>INSERT INTO t (c1,c2) VALUES (v1,v2),(v3,v4);
INSERT INTO t (c1,c2) SELECT a,b FROM s WHERE ..; -- counts match
UPDATE t SET c1=v1,c2=v2 WHERE cond;
DELETE FROM t WHERE cond;
UPDATE t SET c=s.c FROM s WHERE t.k=s.k;   -- via other table
DELETE FROM t USING s WHERE t.k=s.k;</pre>
   <ul>
   <li><b>UPDATE:</b> WHERE picks rows first; SET right side uses <b>old</b> values. SET col has <b>no alias</b>, <b>no column list</b> after table.</li>
   <li>Omitted INSERT cols → DEFAULT, else NULL. DELETE has <b>no JOIN</b> (USING/subquery). Don't repeat target in UPDATE..FROM.</li>
   <li class="bad">Traps: no WHERE = all rows · NOT IN w/ a NULL ⇒ nothing (use NOT EXISTS) · <code>=NULL</code> never true (use IS NULL) · scalar subquery = 1 row.</li>
   <li><b>ILIKE</b>=case-insensitive. <code>%</code>=any run, <code>_</code>=1 char; no % ⇒ whole string.</li>
   </ul>`},
  {hue:"--t0", k:"rows chosen via another table", h:"IN / EXISTS / anti-join", body:
   `<ul>
   <li><b>Has a match:</b> <code>WHERE key IN (SELECT key FROM other WHERE..)</code>.</li>
   <li><b>Has none:</b> <code>NOT EXISTS (SELECT 1 FROM other o WHERE o.key=t.key)</code>. EXISTS needs the <b>correlation line</b>.</li>
   <li><b>Insert only missing</b> (anti-join): <code>INSERT INTO t SELECT .. WHERE key NOT IN (SELECT key FROM t)</code>.</li>
   <li>Subquery in <code>SET</code> must return <b>1 row</b> (use SUM/MAX if several could match); a no-match correlated SET gives <code>qty + NULL = NULL</code> — guard with <code>IN</code>.</li>
   </ul>`},
  {hue:"--t3", k:"change structure (rows kept)", h:"ALTER TABLE (DDL)", body:
   `<pre>ADD COLUMN c TYPE [NOT NULL] [DEFAULT v];
DROP COLUMN c [CASCADE];      RENAME COLUMN old TO new;
ALTER COLUMN c TYPE T [USING c::T];
ALTER COLUMN c SET DEFAULT v | DROP DEFAULT;
ALTER COLUMN c SET NOT NULL | DROP NOT NULL;
ADD CONSTRAINT n CHECK(..)|UNIQUE(c)|PRIMARY KEY(c)
  |FOREIGN KEY(c) REFERENCES p(k);   DROP CONSTRAINT n;</pre>
   <ul>
   <li>Each is <code>ALTER TABLE t &lt;action&gt;;</code>. Several actions = comma-sep; RENAME can't combine. NOT NULL/DEFAULT use ALTER COLUMN. Change a constraint = DROP then ADD.</li>
   <li class="bad">Fails: SET NOT NULL w/ NULLs · ADD CONSTRAINT w/ bad rows · TYPE won't fit (USING) · ADD COLUMN NOT NULL on filled table w/o DEFAULT.</li>
   <li>DROP COLUMN blocked by a dependent <b>view</b> (CASCADE) <b>or an FK elsewhere</b> pointing at it; it also drops that column's own constraints.</li>
   </ul>`},
  {hue:"--t4", k:"parent deleted/updated", h:"Foreign-key actions", body:
   `<table class="t"><tr><th>Option</th><th>Child rows</th></tr>
   <tr><td><code>NO ACTION</code> (default)</td><td>reject if children exist</td></tr>
   <tr><td><code>CASCADE</code></td><td>deleted too / get new key</td></tr>
   <tr><td><code>SET NULL</code></td><td>key→NULL (not if in child PK)</td></tr>
   <tr><td><code>SET DEFAULT</code></td><td>key→its default</td></tr></table>
   <ul><li>Change an action: DROP then ADD the FK (default name <code>table_col_fkey</code>). <b>Circular FK</b>: one col nullable + add FK later via ALTER, or DEFERRABLE + SET CONSTRAINTS DEFERRED.</li></ul>`},
  {hue:"--t1", k:"combine & summarize", h:"Joins · GROUP BY · HAVING", body:
   `<ul>
   <li>Order: SELECT·FROM·<b>WHERE</b>(rows)·GROUP BY·<b>HAVING</b>(groups)·ORDER BY. WHERE can't use aggregates; move them to HAVING.</li>
   <li>INNER=matches only · LEFT=all left, right NULL if none · self-join=2 aliases (<code>e.manager_id=m.emp_id</code>).</li>
   <li>Every non-aggregate SELECT col must be in GROUP BY. Qualify shared names.</li>
   <li>LEFT no-match: <code>COUNT(*)</code>=1 (padded), <code>COUNT(right.col)</code>=0; HAVING on AVG/SUM drops empty LEFT groups (keep with COALESCE).</li>
   <li><code>COUNT</code> w/o GROUP BY = 1 row (0 if none); with GROUP BY an <b>empty group never appears</b>.</li>
   </ul>`}
]},

/* ---------- PAGE 2 : REFERENCE B ---------- */
{ tag:"Reference · page 2 of 4", title:"Reference — PL/pgSQL / Views / Indexes / Transactions", sc:"functions · exceptions · types · views · keys · ACID · locking · security", cards:[
  {hue:"--t5", k:"procedural code", h:"PL/pgSQL", body:
   `<pre>DO $b$ DECLARE _t INT:=0;
BEGIN FOR k IN 1..10 LOOP _t:=_t+k; END LOOP;
  IF _t&gt;50 THEN RAISE INFO 'big %',_t; ELSIF _t=0 THEN ..;
  ELSE ..; END IF; END; $b$ LANGUAGE plpgsql;

CREATE OR REPLACE FUNCTION f(_p TYPE,_o TYPE=dflt)
RETURNS TYPE AS $fb$ DECLARE _v TYPE:=init;
BEGIN .. RETURN value; END; $fb$ LANGUAGE plpgsql;</pre>
   <ul>
   <li><code>:=</code> assigns; <code>;</code> ends each stmt; tags match. <code>ELSIF</code>, <code>END IF;</code>. <b>EXIT</b> leaves loop, <b>RETURN</b> ends fn. Every path returns.</li>
   <li>Defaults last; prefix vars <code>_</code>. <code>SELECT c INTO _v</code> = NULL if no row; MAX/MIN over 0 rows = NULL, COUNT = 0. NULL loop bound = error. DROP FUNCTION by arg types.</li>
   </ul>`},
  {hue:"--t2", k:"validate, don't crash", h:"Exceptions & sentinels", body:
   `<ul>
   <li>Check order: <b>arguments → existence → value</b>. Return <b>negative codes</b> (a real salary is positive); comment each code.</li>
   <li>A failed cast aborts the statement — wrap it in its own <code>BEGIN..EXCEPTION..END;</code>.</li>
   <li><code>'Hi'::INT</code> → <code>invalid_text_representation</code>; past <code>NUMERIC(10,2)</code> max 99999999.99 → <code>numeric_value_out_of_range</code>.</li>
   <li><code>IF NOT FOUND</code> after UPDATE/SELECT = no such row.</li>
   </ul>`},
  {hue:"--t6", k:"1-based · date parts", h:"Arrays · dates · strings", body:
   `<table class="t"><tr><th>fn</th><th>does</th></tr>
   <tr><td><code>a||b</code> · <code>LOWER/UPPER/LENGTH</code></td><td>concat · case/len</td></tr>
   <tr><td><code>TRIM/LTRIM/RTRIM</code></td><td>strip both/left/right</td></tr>
   <tr><td><code>POSITION('x' IN s)</code></td><td>1-based, 0=not found</td></tr>
   <tr><td><code>LEFT/RIGHT(s,n)</code> · <code>SUBSTRING(s FROM 4 FOR 8)</code></td><td>ends · slice</td></tr>
   <tr><td><code>ASCII/CHR</code></td><td>'R'=82; '0'-'9'=48-57</td></tr></table>
   <ul><li>Arrays <b>1-based</b>; <code>CARDINALITY</code>=len (NULL→NULL); test <code>x = ANY(arr)</code>. <code>EXTRACT(MONTH/DAY/DOY FROM d)</code>. Fixed dates only.</li></ul>`},
  {hue:"--t7", k:"stored query", h:"Views", body:
   `<ul>
   <li><code>CREATE VIEW v (c1,c2) AS SELECT..; DROP VIEW v;</code> Rows computed on use; dropping leaves base tables. Uses: <b>data independence, security, convenience</b>.</li>
   <li><b>Updatable</b> (SQL-92): 1 base table, select+project only, no aggregates. Insert → NULL in hidden cols (fails if PK/NOT NULL). <b>WITH CHECK OPTION</b> rejects rows leaving the condition.</li>
   <li>Views with <b>UNION/INTERSECT/EXCEPT</b> can't be inserted into. A view using a col blocks DROP COLUMN (RESTRICT).</li>
   </ul>`},
  {hue:"--t0", k:"constraints vs structures", h:"Keys & indexes", body:
   `<ul>
   <li><b>Superkey</b> ⊇ key · <b>candidate</b> minimal · <b>primary</b> chosen. Keys=constraints; index=performance (search key need not be unique).</li>
   <li><b>Clustered</b>: data order=index order, ≤1/table, range=few contiguous pages. <b>Secondary/unclustered</b>: ~1 page/match (can lose to scan). <b>Unique</b> index contains a candidate key. <b>Index-only</b>: from entries alone.</li>
   <li><b>Hash</b>: equality on <b>full</b> key only. <b>B+ tree</b>: equality+range on a <b>key prefix</b> — <code>&lt;age,sal&gt;</code> can't do <code>sal&gt;40</code>. Cost = root→leaf path + leaves read; height ~3–4.</li>
   <li>Composite bigger, updated when any field changes. SQL std has no CREATE INDEX. Entry forms: record · <code>&lt;key,rid&gt;</code> · <code>&lt;key,rid-list&gt;</code>.</li>
   </ul>`},
  {hue:"--t4", k:"ACID · isolation · locks", h:"Transactions & triggers", body:
   `<ul><li><b>A</b>tomic · <b>C</b>onsistent · <b>I</b>solation (=some serial order) · <b>D</b>urable.</li></ul>
   <table class="t"><tr><th>Level</th><th>Dirty</th><th>Unrep.</th><th>Phantom</th></tr>
   <tr><td>READ UNCOMMITTED</td><td>maybe</td><td>maybe</td><td>maybe</td></tr>
   <tr><td>READ COMMITTED</td><td>no</td><td>maybe</td><td>maybe</td></tr>
   <tr><td>REPEATABLE READ</td><td>no</td><td>no</td><td>maybe</td></tr>
   <tr><td>SERIALIZABLE</td><td>no</td><td>no</td><td>no</td></tr></table>
   <ul>
   <li>Conflicts (same obj, ≥1 write): WR=dirty, RW=unrepeatable, WW=overwrite. Phantom=new matching row between reads.</li>
   <li><b>Strict 2PL</b>: S to read, X to write, hold all to commit/abort; deadlock=cycle, DBMS aborts one. COMMIT/ROLLBACK/SAVEPOINT s/ROLLBACK TO s. A function call = one atomic unit; PREPARE holds 1 stmt.</li>
   <li><b>Trigger</b>=Event+Condition+Action; before/after/instead of; per row/stmt. Proc params IN/OUT/INOUT.</li>
   </ul>`},
  {hue:"--t3", k:"scan the night before", h:"Common mistakes → fixes", body:
   `<table class="t"><tr><th>Wrong</th><th>Right</th></tr>
   <tr><td><code>UPDATE t (col) SET</code></td><td><code>UPDATE t SET</code></td></tr>
   <tr><td><code>SET e.salary=</code></td><td><code>SET salary=</code></td></tr>
   <tr><td><code>WHERE (SELECT 1..)</code></td><td><code>WHERE EXISTS(..)</code></td></tr>
   <tr><td>EXISTS, no correlation</td><td>add <code>AND d.id=e.id</code></td></tr>
   <tr><td><code>ALTER t ALTER col</code></td><td><code>ALTER TABLE t ALTER COLUMN</code></td></tr>
   <tr><td><code>LIKE 'research'</code></td><td><code>ILIKE '%research%'</code></td></tr>
   <tr><td><code>a+b</code> · <code>col=NULL</code></td><td><code>a||b</code> · <code>col IS NULL</code></td></tr>
   <tr><td><code>ELSEIF</code>/no END IF · idx 0</td><td><code>ELSIF</code>/<code>END IF;</code> · idx 1</td></tr>
   <tr><td>aggregate in WHERE · RETURN in loop</td><td>HAVING · <code>EXIT</code></td></tr></table>`}
]},

/* ---------- PAGE 3 : WORKED PROBLEMS A ---------- */
{ tag:"Worked problems · page 3 of 4", title:"Worked Problems — DML / DDL / Queries", sc:"official Exam 2 questions, solved", cards:[
  {hue:"--t0", tag:"Q1", k:"UPDATE + ILIKE + subquery", h:"Double Research salaries",
   prompt:"Employees of departments whose name contains “Research” (case-insensitive): double salary.", body:
   `<pre>UPDATE Employees SET salary = salary * 2
WHERE dept_id IN (SELECT dept_id FROM Departments
                  WHERE dept_name ILIKE '%research%');
-- EXISTS form (needs the correlation line):
UPDATE Employees e SET salary = salary * 2
WHERE EXISTS (SELECT 1 FROM Departments d
   WHERE d.dept_id = e.dept_id AND d.dept_name ILIKE '%sales%');</pre>`,
   note:"Inner query = matching dept ids; outer UPDATE hits their employees."},
  {hue:"--t0", tag:"Q2", k:"DELETE + NOT EXISTS", h:"Drop empty zero-budget depts",
   prompt:"Delete departments with budget 0 AND no employees.", body:
   `<pre>DELETE FROM Departments d
WHERE d.budget = 0.00
  AND NOT EXISTS (SELECT 1 FROM Employees e
                  WHERE e.dept_id = d.dept_id);
-- scalar-count variant:
  AND (SELECT COUNT(*) FROM Employees e
       WHERE e.dept_id = d.dept_id) = 0;</pre>`,
   note:"“No children” ⇒ NOT EXISTS (or COUNT(*) = 0)."},
  {hue:"--t3", tag:"Q3–Q5", k:"ALTER TABLE", h:"Three structure changes",
   prompt:"Add NOT NULL to dept_name; drop manager_id; add salary_expectation.", body:
   `<pre>ALTER TABLE Departments ALTER COLUMN dept_name SET NOT NULL;
ALTER TABLE Employees   DROP COLUMN manager_id;
ALTER TABLE Employees
  ADD COLUMN salary_expectation DECIMAL(15,2) NOT NULL DEFAULT 0.00;</pre>`,
   note:"A NOT NULL column on a filled table needs a DEFAULT; fix NULLs before SET NOT NULL."},
  {hue:"--t1", tag:"Q10", k:"JOIN + GROUP BY + HAVING", h:"Per-department stats",
   prompt:"department_name, employees_no, max_salary — only depts whose average salary > 5000.", body:
   `<pre>SELECT d.dept_name AS department_name,
       COUNT(e.emp_id) AS employees_no,
       MAX(e.salary)   AS max_salary
FROM Departments d
JOIN Employees e ON e.dept_id = d.dept_id
GROUP BY d.dept_id, d.dept_name
HAVING AVG(e.salary) &gt; 5000.00;
-- keep empty depts: LEFT JOIN + COALESCE(SUM(e.salary),0.00)</pre>`,
   note:"Aggregate filter → HAVING. Group by PK + any selected label column."},
  {hue:"--t1", tag:"extra", k:"correlated subquery / HAVING", h:"Two common query shapes",
   prompt:"Above own-dept average; department payroll over budget.", body:
   `<pre>SELECT e.emp_id, e.fname, e.lname, e.salary
FROM Employees e

SELECT d.dept_name, d.budget, SUM(e.salary) AS payroll
FROM Departments d JOIN Employees e ON e.dept_id = d.dept_id

/* ---------- PAGE 4 : WORKED PROBLEMS B ---------- */
{ tag:"Worked problems · page 4 of 4", title:"Worked Problems — Functions / Transactions / Security", sc:"validation · arrays · info string · atomic updates · privileges", cards:[
  {hue:"--t2", tag:"Q6", k:"validate + cast + sentinels", h:"f_SetSalary",
   prompt:"Validate id & salary text, set salary; success returns salary, errors return negative codes.", body:
   `<pre>CREATE OR REPLACE FUNCTION f_SetSalary(_emp_id BIGINT,
       _new_salary VARCHAR(20)) RETURNS DECIMAL(10,2) AS $fb$
DECLARE _salary DECIMAL(10,2) := NULL;
BEGIN
  IF _emp_id IS NULL OR NOT EXISTS
     (SELECT 1 FROM Employees WHERE emp_id=_emp_id)
  THEN RETURN -1.00; END IF;             -- bad id / none
  IF _new_salary IS NULL THEN RETURN -2.00; END IF;
  BEGIN                                  -- risky cast, own block
    _salary := TRIM(_new_salary)::DECIMAL(10,2);
  EXCEPTION
    WHEN invalid_text_representation THEN RETURN -2.00;
    WHEN numeric_value_out_of_range  THEN RETURN -3.00;
  END;
  IF _salary &lt; 0 THEN RETURN -4.00; END IF;
  UPDATE Employees SET salary=_salary WHERE emp_id=_emp_id;
  RETURN _salary;
END; $fb$ LANGUAGE plpgsql;</pre>`,
   note:"Order: argument → existence → value. Cast isolated so a bad string returns a code, not a crash."},
  {hue:"--t6", tag:"Q11", k:"array + EXTRACT + ANY", h:"f_IsHoliday",
   prompt:"TRUE if the date is a fixed holiday.", body:
   `<pre>CREATE OR REPLACE FUNCTION f_IsHoliday(_date DATE)
RETURNS BOOLEAN AS $fb$
DECLARE _h INTEGER[] := ARRAY[101,704,1111,1225]; -- mo*100+day
        _k INTEGER;
BEGIN
  IF _date IS NULL THEN RETURN FALSE; END IF;
  _k := EXTRACT(MONTH FROM _date)*100 + EXTRACT(DAY FROM _date);
  RETURN _k = ANY(_h);            -- or FOR-loop compare
END; $fb$ LANGUAGE plpgsql;</pre>`,
   note:"Encode each holiday as month*100+day; one <code>= ANY</code> membership test."},
  {hue:"--t7", tag:"Quiz 2", k:"existence vs empty branches", h:"f_GetDeptInfo",
   prompt:"Return a sentence: dept name, head, count, avg; handle NULL id / missing / empty.", body:
   `<pre>IF p_dept_id IS NULL THEN RETURN 'ID cannot be NULL'; END IF;
SELECT COUNT(*) INTO v_exists FROM Departments
 WHERE dept_id=p_dept_id;
IF v_exists=0 THEN RETURN 'Department does not exist'; END IF;
SELECT dept_name,dept_head INTO v_name,v_head
 FROM Departments WHERE dept_id=p_dept_id;
SELECT COUNT(*), COALESCE(AVG(salary),0.00)
 INTO v_cnt,v_avg FROM Employees WHERE dept_id=p_dept_id;
IF v_cnt=0 THEN RETURN 'has 0 employees'; END IF;  -- empty
RETURN v_name||' has '||v_cnt||' employees; avg '||v_avg;</pre>`,
   note:"Three separate branches: NULL arg vs. missing dept vs. empty dept. COALESCE guards head/avg."},
  {hue:"--t5", tag:"Q12", k:"aggregate + threshold", h:"f_getLargestSalariedEmployees",
   prompt:"Count employees earning ≥ 95% of their department's max salary.", body:
   `<pre>CREATE OR REPLACE FUNCTION f_getLargestSalariedEmployees(
       _dept_id SMALLINT) RETURNS SMALLINT AS $fb$
DECLARE _max DECIMAL(10,2); _n INTEGER;
BEGIN
  IF _dept_id IS NULL THEN RETURN -1; END IF;      -- bad arg
  SELECT MAX(salary) INTO _max FROM Employees
   WHERE dept_id=_dept_id;
  IF _max IS NULL THEN RETURN 0; END IF;           -- empty dept
  SELECT COUNT(emp_id) INTO _n FROM Employees
   WHERE dept_id=_dept_id AND salary &gt;= 0.95*_max;
  RETURN _n;
END; $fb$ LANGUAGE plpgsql;</pre>`,
   note:"MAX is NULL ⇒ empty department (sentinel 0); -1 for a bad argument."},
  {hue:"--t4", tag:"Q9", k:"two updates, all-or-none", h:"Atomic transaction",
   prompt:"Set Departments.dept_head and the head's dept_id together; abort on any failure.", body:
   `<pre>DO $B$ DECLARE _ret INTEGER;
BEGIN
  UPDATE Departments SET dept_head=2317 WHERE dept_id=19
    RETURNING dept_id INTO _ret;
  IF _ret IS NULL THEN RAISE EXCEPTION 'Dept not found'; END IF;
  _ret := NULL;
  UPDATE Employees SET dept_id=19 WHERE emp_id=2317
    RETURNING emp_id INTO _ret;
  IF _ret IS NULL THEN RAISE EXCEPTION 'Emp not found'; END IF;
END; $B$ LANGUAGE plpgsql;</pre>`,
   note:"A DO block is one unit — any RAISE EXCEPTION rolls back both. Plain SQL: BEGIN; .. ; COMMIT;"},
  {hue:"--t3", tag:"Q7", k:"column security", h:"Hide the salary column",
   prompt:"Everyone reads non-salary columns; only approved users read salary.", body:
   `<pre>REVOKE SELECT ON Employees FROM PUBLIC;
GRANT SELECT(emp_id,fname,lname,dept_id,manager_id)
      ON Employees TO PUBLIC;
GRANT SELECT(salary) ON Employees TO salary_readers;
-- or: a view without salary, grant the view to PUBLIC.</pre>`,
   note:"Column-level GRANT exposes only the listed columns; put trusted users in a role."}
]}
];

/* ===================== HIGHLIGHTER ===================== */
const KW=["SELECT","FROM","WHERE","INSERT","INTO","VALUES","UPDATE","SET","DELETE","USING","CREATE","REPLACE","VIEW","FUNCTION","RETURNS","RETURN","RETURNING","DECLARE","BEGIN","END","IF","THEN","ELSIF","ELSE","CASE","WHEN","LOOP","FOR","EXIT","EXCEPTION","RAISE","LANGUAGE","JOIN","LEFT","RIGHT","INNER","ON","GROUP","ORDER","HAVING","AND","OR","NOT","EXISTS","NULL","IS","LIKE","ILIKE","ANY","BY","AS","IN","COUNT","SUM","AVG","MAX","MIN","COALESCE","TRIM","EXTRACT","MONTH","DAY","DOY","CARDINALITY","TO_CHAR","POSITION","SUBSTRING","LOWER","UPPER","LENGTH","ASCII","CHR","LTRIM","RTRIM","ALTER","TABLE","ADD","COLUMN","DROP","CONSTRAINT","CHECK","UNIQUE","PRIMARY","KEY","FOREIGN","REFERENCES","DEFAULT","CASCADE","RENAME","TYPE","COMMIT","ROLLBACK","SAVEPOINT","PREPARE","GRANT","REVOKE","ROLE","TO","PUBLIC","DO","ARRAY","INFO","FOUND","WITH","OPTION","DEFERRABLE","CONSTRAINTS","DEFERRED","INTEGER","SMALLINT","BIGINT","DECIMAL","NUMERIC","VARCHAR","TEXT","DATE","BOOLEAN","INT","TRUE","FALSE","OTHERS"];
const KWRE=new RegExp("\\b("+KW.join("|")+")\\b","g");
function hlLine(line){
  let ci=line.indexOf("--");
  let code=ci>=0?line.slice(0,ci):line;
  let com=ci>=0?line.slice(ci):"";
  code=code.replace(/('[^']*')/g,'\u0001$1\u0002');
  code=code.replace(KWRE,'<span class="kw">$1</span>');
  code=code.replace(/\u0001([^\u0002]*)\u0002/g,'<span class="str">$1</span>');
  if(com) com='<span class="cm">'+com+'</span>';
  return code+com;
}
function highlightPres(root){ root.querySelectorAll("pre").forEach(pre=>{ pre.innerHTML=pre.innerHTML.split("\n").map(hlLine).join("\n"); }); }
