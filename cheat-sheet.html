<script>
/* ---------- content ---------- */
const PAGES = [
{ tag:"Sheet 1 · Front — page 1 of 4", title:"DML &amp; DDL", sc:"INSERT · UPDATE · DELETE · ALTER · foreign keys", cards:[
  {hue:"--t0", k:"add / change / remove rows", h:"DML syntax", body:
   `<pre>INSERT INTO t (c1,c2) VALUES (v1,v2),(v3,v4);
INSERT INTO t (c1,c2) SELECT a,b FROM s WHERE ..; -- list counts match
UPDATE t SET c1=v1, c2=v2 WHERE cond;
DELETE FROM t WHERE cond;
UPDATE t SET c=s.c FROM s WHERE t.k=s.k;  -- from other table
DELETE FROM t USING s WHERE t.k=s.k;      -- delete via other</pre>
   <ul>
   <li><b>UPDATE:</b> WHERE picks rows first; SET right side uses <b>old</b> values. SET col has <b>no alias</b> (<code>SET salary</code>), <b>no column list</b> after table.</li>
   <li>Omitted INSERT cols get DEFAULT, else NULL.</li>
   <li>DELETE allows <b>no JOIN</b> — use USING / subquery. Don't repeat target in UPDATE..FROM.</li>
   </ul>`},
  {hue:"--t0", k:"pick rows via another table", h:"IN / EXISTS + traps", body:
   `<pre>-- rows that HAVE a match
UPDATE Employees SET salary=salary*2
WHERE dept_id IN (SELECT dept_id FROM Departments
                  WHERE dept_name ILIKE '%research%');
-- EXISTS (keyword + correlation line!)
UPDATE Employees e SET salary=salary*2
WHERE EXISTS (SELECT 1 FROM Departments d
   WHERE d.dept_id=e.dept_id AND d.dept_name ILIKE '%sales%');
-- rows with NONE
DELETE FROM Departments d
WHERE d.budget=0.00
  AND NOT EXISTS (SELECT 1 FROM Employees e
                  WHERE e.dept_id=d.dept_id);</pre>
   <ul>
   <li><b>ILIKE</b>=case-insensitive. <code>%</code>=any run, <code>_</code>=1 char; no % ⇒ whole string.</li>
   <li class="bad">NOT IN with a NULL ⇒ nothing: use NOT EXISTS. <code>=NULL</code> never true: use IS NULL. Scalar subquery = 1 row. No WHERE = every row.</li>
   </ul>`},
  {hue:"--t3", k:"change structure (rows kept)", h:"ALTER TABLE (DDL)", body:
   `<pre>ADD COLUMN c TYPE [NOT NULL] [DEFAULT v];
DROP COLUMN c [CASCADE];
RENAME COLUMN old TO new;   RENAME TO newtable;
ALTER COLUMN c TYPE T [USING c::T];
ALTER COLUMN c SET DEFAULT v;  / DROP DEFAULT
ALTER COLUMN c SET NOT NULL;   / DROP NOT NULL
ADD CONSTRAINT n CHECK(..) | UNIQUE(c)
  | PRIMARY KEY(c) | FOREIGN KEY(c) REFERENCES p(k);
DROP CONSTRAINT n;</pre>
   <ul>
   <li>Each line is <code>ALTER TABLE t &lt;action&gt;;</code>. Several actions = comma-sep; RENAME can't combine.</li>
   <li>NOT NULL/DEFAULT use <b>ALTER COLUMN</b>, not ADD CONSTRAINT. Change a constraint = DROP then ADD.</li>
   <li class="bad">Fails: SET NOT NULL w/ NULLs; ADD CONSTRAINT w/ bad rows; TYPE won't fit (USING); ADD COLUMN NOT NULL on filled table w/o DEFAULT; DROP COLUMN used by a view (CASCADE).</li>
   </ul>`},
  {hue:"--t4", k:"parent deleted/updated", h:"Foreign-key actions", body:
   `<table class="t"><tr><th>Option</th><th>Child rows</th></tr>
   <tr><td><code>NO ACTION</code> (default)</td><td>reject if children exist</td></tr>
   <tr><td><code>CASCADE</code></td><td>deleted too / get new key</td></tr>
   <tr><td><code>SET NULL</code></td><td>key col → NULL (not if in child PK)</td></tr>
   <tr><td><code>SET DEFAULT</code></td><td>key col → its default</td></tr></table>
   <ul>
   <li>Change an action: DROP then ADD the FK. Default name <code>table_col_fkey</code>.</li>
   <li><b>Circular FK</b> (dept_id ↔ dept_head): one col nullable, add FK later via ALTER; or DEFERRABLE + SET CONSTRAINTS DEFERRED.</li>
   </ul>`},
  {hue:"--t5", k:"recipe", h:"Rows via another table", body:
   `<ul>
   <li>Write inner <code>SELECT key FROM other WHERE..</code>; run it alone in your head.</li>
   <li>Outer: <code>WHERE key IN (inner)</code> (has match) or <code>NOT EXISTS(..WHERE o.key=t.key)</code> (none).</li>
   <li>EXISTS needs the correlation line. SET no alias; UPDATE no col list; DELETE no JOIN.</li>
   </ul>`}
]},

{ tag:"Sheet 1 · Back — page 2 of 4", title:"Queries &amp; PL/pgSQL", sc:"joins · GROUP BY · HAVING · functions · exceptions", cards:[
  {hue:"--t1", k:"combine &amp; summarize", h:"Joins · GROUP BY · HAVING", body:
   `<ul>
   <li>Order: SELECT · FROM · <b>WHERE</b>(rows) · GROUP BY · <b>HAVING</b>(groups) · ORDER BY. WHERE can't use aggregates.</li>
   <li>INNER = matches only. LEFT = all left, right NULL if none. Self-join = 2 aliases (<code>e.manager_id=m.emp_id</code>).</li>
   <li>Every non-aggregate SELECT col must be in GROUP BY. Qualify shared names.</li>
   <li>LEFT no-match: <code>COUNT(*)</code>=1 (padded row), <code>COUNT(right.col)</code>=0. HAVING on AVG/SUM drops empty LEFT groups — use COALESCE to keep.</li>
   </ul>`},
  {hue:"--t1", k:"templates", h:"Aggregate queries", body:
   `<pre>-- per-dept stats, only avg &gt; 5000
SELECT d.dept_name, COUNT(e.emp_id) AS employees_no,
       MAX(e.salary) AS max_salary
FROM Departments d
JOIN Employees e ON e.dept_id=d.dept_id
GROUP BY d.dept_id, d.dept_name
HAVING AVG(e.salary) &gt; 5000.00;
-- keep empty depts
LEFT JOIN Employees e ON e.dept_id=d.dept_id
.. COALESCE(SUM(e.salary),0.00) ..
-- above own-dept average
WHERE e.salary &gt; (SELECT AVG(e2.salary) FROM Employees e2
                 WHERE e2.dept_id=e.dept_id);
-- payroll over budget
GROUP BY d.dept_id,d.dept_name,d.budget
HAVING SUM(e.salary) &gt; d.budget;</pre>`},
  {hue:"--t5", k:"procedural code", h:"PL/pgSQL blocks &amp; functions", body:
   `<pre>DO $b$
DECLARE _t INTEGER := 0;
BEGIN
  FOR k IN 1..10 LOOP _t := _t + k; END LOOP;
  IF _t &gt; 50 THEN RAISE INFO 'big %', _t;
  ELSIF _t = 0 THEN RAISE INFO 'none';
  ELSE RAISE INFO 'small %', _t; END IF;
END; $b$ LANGUAGE plpgsql;

CREATE OR REPLACE FUNCTION public.f_Name(_p TYPE, _o TYPE=dflt)
RETURNS TYPE AS $fb$
DECLARE _v TYPE := init;
BEGIN ... RETURN value; END;         -- every path returns
$fb$ LANGUAGE plpgsql;
DROP FUNCTION IF EXISTS public.f_Name(VARCHAR(20)); -- by arg types</pre>
   <ul>
   <li><code>:=</code> assigns; <code>;</code> ends each stmt; tags match. <code>ELSIF</code>, <code>END IF;</code>. <b>EXIT</b> leaves a loop, <b>RETURN</b> ends the function.</li>
   <li>Defaults go at the end. Prefix vars with <code>_</code>. <code>SELECT c INTO _v..</code> = NULL if no row; MAX/MIN over 0 rows = NULL, COUNT = 0.</li>
   </ul>`},
  {hue:"--t2", k:"validate, don't crash", h:"Exceptions &amp; sentinels", body:
   `<pre>IF _emp_id IS NULL
   OR NOT EXISTS(SELECT 1 FROM Employees WHERE emp_id=_emp_id)
THEN RETURN -1.00; END IF;              -- bad id / none
BEGIN                                   -- risky cast, own block
  _salary := TRIM(_new_salary)::DECIMAL(10,2);
EXCEPTION
  WHEN invalid_text_representation THEN RETURN -2.00; -- '12abc',''
  WHEN numeric_value_out_of_range  THEN RETURN -3.00; -- too big
END;
IF _salary &lt; 0 THEN RETURN -4.00; END IF;  -- bad value
UPDATE Employees SET salary=_salary WHERE emp_id=_emp_id;
IF NOT FOUND THEN RETURN -5.00; END IF;     -- no row updated
RETURN _salary;</pre>
   <ul>
   <li>Check order: <b>arguments → existence → value</b>. Codes negative (real salary is positive); comment each code.</li>
   <li>Failed cast aborts the stmt — wrap in its own <code>BEGIN..EXCEPTION..END;</code>. <code>NUMERIC(10,2)</code> max 99999999.99.</li>
   </ul>`}
]},

{ tag:"Sheet 2 · Front — page 3 of 4", title:"Types · Views · Indexes", sc:"arrays/strings/dates · views · keys · B+ trees", cards:[
  {hue:"--t6", k:"1-based · date parts", h:"Arrays, dates, strings", body:
   `<table class="t"><tr><th>fn</th><th>does</th></tr>
   <tr><td><code>a || b</code></td><td>concat text</td></tr>
   <tr><td><code>LOWER/UPPER/LENGTH</code></td><td>case / length</td></tr>
   <tr><td><code>TRIM/LTRIM/RTRIM</code></td><td>strip both/left/right</td></tr>
   <tr><td><code>POSITION('x' IN s)</code></td><td>1-based, 0=not found</td></tr>
   <tr><td><code>LEFT/RIGHT(s,n)</code></td><td>first / last n</td></tr>
   <tr><td><code>SUBSTRING(s FROM 4 FOR 8)</code></td><td>slice</td></tr>
   <tr><td><code>ASCII/CHR</code></td><td>'R'=82; digits '0'-'9'=48-57</td></tr></table>
   <ul><li>Arrays <b>1-based</b>; <code>CARDINALITY</code>=len (NULL→NULL). Test <code>x = ANY(arr)</code>. EXTRACT(MONTH/DAY/DOY FROM d). Fixed dates only (no Thanksgiving).</li></ul>
   <pre>_h INTEGER[] := ARRAY[101,704,1111,1225]; -- mo*100+day
_k := EXTRACT(MONTH FROM _date)*100 + EXTRACT(DAY FROM _date);
RETURN _k = ANY(_h);   -- or TO_CHAR(d,'MM-DD') = ANY(txt[])</pre>`},
  {hue:"--t7", k:"stored query", h:"Views", body:
   `<pre>CREATE VIEW v (c1,c2) AS SELECT ...;   DROP VIEW v;
-- employee info: self-join for manager
CREATE OR REPLACE VIEW Employee_Info AS
SELECT e.emp_id, e.fname||' '||e.lname AS full_name,
       d.dept_name, e.salary,
       COALESCE(m.fname||' '||m.lname,'N/A') AS manager
FROM Employees e
JOIN Departments d ON d.dept_id=e.dept_id
LEFT JOIN Employees m ON m.emp_id=e.manager_id;</pre>
   <ul>
   <li>Rows computed on use; dropping leaves base tables. LEFT JOIN keeps top manager / no-dept rows.</li>
   <li><b>Updatable</b> (SQL-92): 1 base table, select+project only, no aggregates. Insert → NULL in hidden cols (fails if PK/NOT NULL). WITH CHECK OPTION rejects rows leaving the condition.</li>
   <li>A view using a col blocks DROP COLUMN (RESTRICT) until dropped.</li>
   </ul>`},
  {hue:"--t7", k:"dept info function", h:"Check order in a function", body:
   `<pre>IF p_dept_id IS NULL THEN RETURN 'ID cannot be NULL'; END IF;
SELECT COUNT(*) INTO v_exists FROM Departments
 WHERE dept_id=p_dept_id;
IF v_exists=0 THEN RETURN 'does not exist'; END IF;  -- existence
SELECT COUNT(*), COALESCE(AVG(salary),0.00)
  INTO v_cnt, v_avg FROM Employees WHERE dept_id=p_dept_id;
IF v_cnt=0 THEN RETURN '..has 0 employees'; END IF;  -- empty
RETURN '..has '||v_cnt||' employees; avg '||v_avg;</pre>
   <ul><li>Separate branches: NULL arg vs. missing dept vs. empty dept. COALESCE guards head name / avg.</li></ul>`},
  {hue:"--t0", k:"constraints vs structures", h:"Keys &amp; indexes", body:
   `<ul>
   <li><b>Superkey</b> ⊇ key; <b>candidate</b> minimal; <b>primary</b> chosen. Keys=constraints; index=performance (search key need not be unique).</li>
   <li><b>Clustered</b>: data order = index order; ≤1 per table; range = few contiguous pages. <b>Secondary/unclustered</b>: ~1 page read per match (can lose to scan). <b>Index-only</b>: answered from entries (ok unclustered).</li>
   <li><b>Hash</b>: equality on <b>full</b> key only. <b>B+ tree</b>: equality + range on a <b>key prefix</b> — <code>&lt;age,sal&gt;</code> can't do <code>sal&gt;40</code>.</li>
   <li>Composite index bigger; updated when any field changes. SQL std has no CREATE INDEX. Entry forms: record / <code>&lt;key,rid&gt;</code> / <code>&lt;key,rid-list&gt;</code>.</li>
   </ul>`},
  {hue:"--t0", k:"search cost", h:"B+ tree", body:
   `<pre>Root: 13 | 17 | 24 | 30
[2 3 5 7]->[14 16]->[19 20 22]->[24 27 29]->[33 34 38 39]
Search 15: 13&lt;=15&lt;17 -> leaf [14 16] -> absent.
Range 17..27: leaf for 17, follow 'next' links.
cost = root->leaf path + leaves read. height ~3-4.</pre>`}
]},

{ tag:"Sheet 2 · Back — page 4 of 4", title:"Transactions · Security · Fixes", sc:"ACID · isolation · triggers · GRANT · mistakes", cards:[
  {hue:"--t4", k:"all or nothing", h:"Transactions &amp; ACID", body:
   `<ul><li><b>A</b>tomic (all/none) · <b>C</b>onsistent in→out · <b>I</b>solation (= some serial order) · <b>D</b>urable (survives crash).</li></ul>
   <table class="t"><tr><th>Isolation</th><th>Dirty</th><th>Unrep.</th><th>Phantom</th></tr>
   <tr><td>READ UNCOMMITTED</td><td>maybe</td><td>maybe</td><td>maybe</td></tr>
   <tr><td>READ COMMITTED</td><td>no</td><td>maybe</td><td>maybe</td></tr>
   <tr><td>REPEATABLE READ</td><td>no</td><td>no</td><td>maybe</td></tr>
   <tr><td>SERIALIZABLE</td><td>no</td><td>no</td><td>no</td></tr></table>
   <ul>
   <li>Conflicts (same obj, ≥1 write): WR=dirty read, RW=unrepeatable, WW=overwrite. Phantom=new matching row between reads.</li>
   <li><b>Strict 2PL</b>: S lock to read, X to write; hold all to commit/abort. Deadlock=wait cycle, DBMS aborts one.</li>
   <li>COMMIT / ROLLBACK / SAVEPOINT s / ROLLBACK TO SAVEPOINT s.</li>
   </ul>`},
  {hue:"--t4", k:"two updates as one", h:"Atomic transaction", body:
   `<pre>DO $B$
DECLARE _ret INTEGER;
BEGIN
  UPDATE Departments SET dept_head=2317 WHERE dept_id=19
    RETURNING dept_id INTO _ret;
  IF _ret IS NULL THEN RAISE EXCEPTION 'Dept not found'; END IF;
  _ret := NULL;
  UPDATE Employees SET dept_id=19 WHERE emp_id=2317
    RETURNING emp_id INTO _ret;
  IF _ret IS NULL THEN RAISE EXCEPTION 'Emp not found'; END IF;
END; $B$ LANGUAGE plpgsql;
-- plain: BEGIN; UPDATE..; UPDATE..; COMMIT;  (or ROLLBACK;)</pre>
   <ul><li>A DO block / function is one unit — any error or RAISE EXCEPTION rolls back all. Validate with RETURNING..INTO + NULL check. PREPARE holds 1 stmt only.</li></ul>`},
  {hue:"--t2", k:"E-C-A · column security", h:"Triggers &amp; permissions", body:
   `<ul><li><b>Trigger</b> = Event + Condition + Action; before / after / instead of; per row / per statement. Proc params: IN, OUT, INOUT.</li></ul>

/* ---------- SQL highlighter ---------- */
const KW=["SELECT","FROM","WHERE","INSERT","INTO","VALUES","UPDATE","SET","DELETE","USING","CREATE","REPLACE","VIEW","FUNCTION","RETURNS","RETURN","RETURNING","DECLARE","BEGIN","END","IF","THEN","ELSIF","ELSE","CASE","WHEN","LOOP","FOR","EXIT","EXCEPTION","RAISE","LANGUAGE","JOIN","LEFT","RIGHT","INNER","ON","GROUP","ORDER","HAVING","AND","OR","NOT","EXISTS","NULL","IS","LIKE","ILIKE","ANY","BY","AS","IN","COUNT","SUM","AVG","MAX","MIN","COALESCE","TRIM","EXTRACT","MONTH","DAY","DOY","CARDINALITY","TO_CHAR","POSITION","SUBSTRING","LOWER","UPPER","LENGTH","ASCII","CHR","LTRIM","RTRIM","ALTER","TABLE","ADD","COLUMN","DROP","CONSTRAINT","CHECK","UNIQUE","PRIMARY","KEY","FOREIGN","REFERENCES","DEFAULT","CASCADE","RENAME","TYPE","COMMIT","ROLLBACK","SAVEPOINT","PREPARE","GRANT","REVOKE","ROLE","TO","PUBLIC","DO","ARRAY","INFO","FOUND","WITH","OPTION","DEFERRABLE","CONSTRAINTS","DEFERRED","INTEGER","SMALLINT","BIGINT","DECIMAL","NUMERIC","VARCHAR","TEXT","DATE","BOOLEAN","INT","TRUE","FALSE","OTHERS"];
const KWRE=new RegExp("\\b("+KW.join("|")+")\\b","g");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function hlLine(line){
  // line already contains HTML entities (&gt; etc.) from authoring; protect them
  let ci=line.indexOf("--");
  let codePart = ci>=0?line.slice(0,ci):line;
  let com = ci>=0?line.slice(ci):"";
  codePart = codePart.replace(/('[^']*')/g,'\u0001$1\u0002');
  codePart = codePart.replace(KWRE,'<span class="kw">$1</span>');
  codePart = codePart.replace(/\u0001([^\u0002]*)\u0002/g,'<span class="str">$1</span>');
  if(com) com='<span class="cm">'+com+'</span>';
  return codePart+com;
}
function highlightPres(root){
  root.querySelectorAll("pre").forEach(pre=>{
    pre.innerHTML = pre.innerHTML.split("\n").map(hlLine).join("\n");
  });
}

/* ---------- render ---------- */

    <div class="head"><h1>${pg.title}</h1><span class="sc">${pg.sc}</span></div>

  });
  html+=`</div>`;
  if(pi===PAGES.length-1) html+=`<div class="footnote">COP 4710 Midterm 2 · DML/DDL · queries · PL/pgSQL · views · indexes · transactions · cheat sheet (4 pages)</div>`;
  sec.innerHTML=html;
  highlightPres(sec);
  pagesEl.appendChild(sec);
});

/* ---------- theme + print ---------- */
const store=(()=>{try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return localStorage;}catch(e){return null;}})();
const root=document.documentElement, tbtn=document.getElementById("themeBtn");
function applyTheme(t){ if(t==="system"){root.removeAttribute("data-theme");tbtn.textContent="◐ Auto";} else {root.setAttribute("data-theme",t);tbtn.textContent=(t==="dark"?"☾ Dark":"☀ Light");} try{store&&store.setItem("m2-cheat-theme",t);}catch(e){} }
let cur="system"; try{ if(store) cur=store.getItem("m2-cheat-theme")||"system"; }catch(e){}
applyTheme(cur);
tbtn.addEventListener("click",()=>{ cur=cur==="system"?"light":cur==="light"?"dark":"system"; applyTheme(cur); });
document.getElementById("printBtn").addEventListener("click",()=>window.print());
